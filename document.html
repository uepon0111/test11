          for(let i=0,k=0;i<n;i++,p+=st,k+=3){o[k]+=d[p];o[k+1]+=d[p+1];o[k+2]+=d[p+2]}}
        for(let i=0;i<o.length;i++)o[i]/=c;return o}

      /* ---- 順序つき区間分割（動的計画法） --------------------------------------
       * sc[k][i] : 画素iが区間kに属するとした時の適合度（+1一致 / 0中立 / -1不一致）
       * minLen[k]: 区間kの最小長。 戻り値 b[k] = 区間kの終端（= 次区間の始端）
       * 区間0は先頭から、最終区間は末尾までを必ず覆う。計算量 O(K·n)。               */
      function segDP(sc,minLen){const K=sc.length,n=sc[0].length,NEG=-1e18,P=[],dp=[],bk=[];
        for(let k=0;k<K;k++){const p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+sc[k][i];P.push(p)}
        for(let k=0;k<K;k++){const d=new Float64Array(n+1).fill(NEG),b=new Int32Array(n+1).fill(-1);dp.push(d);bk.push(b);
          if(k==0){for(let i=minLen[0];i<=n;i++)d[i]=P[0][i];continue}
          let best=NEG,arg=-1;
          for(let i=0;i<=n;i++){const s=i-minLen[k];
            if(s>=0&&dp[k-1][s]>NEG/2){const v=dp[k-1][s]-P[k][s];if(v>best){best=v;arg=s}}
            if(arg>=0){d[i]=best+P[k][i];b[i]=arg}}}
        if(dp[K-1][n]<NEG/2)return null;
        const e=new Array(K);let i=n;for(let k=K-1;k>=0;k--){e[k]=i;i=bk[k][i]}
        return{b:e.slice(0,K-1),score:dp[K-1][n],seg:e}}

      /* ---- 境界の連鎖探索：各境界j の証拠 ev[j][i] の総和が最大になる並びを選ぶ ----
       * minGap[j] : 直前の境界(j=0なら0)からの最小距離                                 */
      function chainDP(ev,minGap){const J=ev.length,n=ev[0].length,NEG=-1e18,dp=[],bk=[];
        for(let j=0;j<J;j++){const d=new Float64Array(n).fill(NEG),b=new Int32Array(n).fill(-1);dp.push(d);bk.push(b);
          if(j==0){for(let i=minGap[0];i<n;i++)d[i]=ev[0][i];continue}
          let best=NEG,arg=-1;
          for(let i=0;i<n;i++){const s=i-minGap[j];
            if(s>=0&&dp[j-1][s]>NEG/2&&dp[j-1][s]>best){best=dp[j-1][s];arg=s}
            if(arg>=0){d[i]=best+ev[j][i];b[i]=arg}}}
        let bi=-1,bv=NEG;for(let i=0;i<n;i++)if(dp[J-1][i]>bv){bv=dp[J-1][i];bi=i}
        if(bi<0)return null;const r=new Array(J);let i=bi;for(let j=J-1;j>=0;j--){r[j]=i;i=bk[j][i]}
        return{b:r,score:bv}}

      /* 窓平均の差（段差応答）：位置iの前後w画素の平均の差 = after - before */
      function stepResp(a,w){const n=a.length,ps=new Float64Array(n+1);for(let i=0;i<n;i++)ps[i+1]=ps[i]+a[i];
        const o=new Float32Array(n);for(let i=w;i<=n-w;i++)o[i]=(ps[i+w]-ps[i])/w-(ps[i]-ps[i-w])/w;return o}

      class Fail extends Error{constructor(step,msg){super(msg);this.step=step}}

      /* ============================================================================
       * detect
       * ========================================================================== */
      function detect(im){
        const W=im.w,H=im.h,pw=Math.min(W,H)>=800?1:0;
        const L={ok:false,err:null,errStep:0,W,H,p:{},reg:{},scans:[],lines:[],log:[],warn:[],conf:{}};
        const log=(s,t)=>L.log.push({s,t}),warn=(s,t)=>{L.warn.push({s,t});};
        /* s:手順番号 c:色名 o:'h'|'v' p:位置 a,b:範囲 */
        const scan=(s,c,o,p,a,b,main)=>L.scans.push({s,c,o,p,a,b,main:main!==false});
        const line=(s,c,o,p,a,b,t)=>L.lines.push({s,c,o,p,a,b,t});
        const P=L.p;
        try{

        /* ---------------------------------------------------------------------
         * 手順1：画面最上部中央付近を縦にスキャン（赤の細線）
         *        「白枠(#ABACBD) → 背景(#323558)」の変化で白枠の下端・縦幅を求める
         * ------------------------------------------------------------------- */
        {const nC=7,span=Math.max(8,Math.round(W*.05)),y1=Math.floor(H*.45),xs=[],res=[],Fs=[];
         for(let i=0;i<nC;i++)xs.push(Math.round(W/2+(i/(nC-1)-.5)*span));
         for(const x of xs){const pr=vline(im,x,0,y1,pw),n=y1,s0=new Float32Array(n),sF=new Float32Array(n),sB=new Float32Array(n);
           for(let i=0;i<n;i++){const r=pr[i*3],g=pr[i*3+1],b=pr[i*3+2];
             sF[i]=sm(dist(r,g,b,REF.F),T.F*1.6);sB[i]=sm(dist(r,g,b,REF.BG),T.BG*1.4)}
           /* 区間0=上余白(何でもよい=中立) / 区間1=白枠 / 区間2=背景 */
           const sg=segDP([s0,sF,sB],[0,Math.round(H*.04),Math.round(H*.03)]);
           if(sg)res.push({x,top:sg.b[0],bot:sg.b[1]});
           scan(1,'red','v',x,0,y1,x==xs[nC>>1])}
         const fb=fuse(res.map(r=>r.bot),Math.max(3,H*.006)),ft=fuse(res.map(r=>r.top),Math.max(3,H*.006));
         if(!fb||fb.n<Math.ceil(nC/2))throw new Fail(1,'画面上部の白枠の下端を特定できません');
         P.top=ft?ft.v:0;P.fb=fb.v;P.bh=P.fb-P.top;L.conf.s1=fb.n+'/'+nC;
         /* 白枠色をこの画像の実測値に較正する（色管理・明るさの違いに追従）。
          * 白枠の内側にある中央付近の画素の中央値を採り、仕様値から大きく外れる時だけ仕様値を使う。
          * 明るさ比 kap は、帯の明るさなど他の基準色を実画像に合わせるのに使う */
         let Fc=REF.F;const pxs=[[],[],[]];
         for(const x of xs){const pr=vline(im,x,P.top+2,Math.max(P.top+3,P.fb-2),0);for(let i=0;i<pr.length/3;i++){pxs[0].push(pr[i*3]);pxs[1].push(pr[i*3+1]);pxs[2].push(pr[i*3+2])}}
         if(pxs[0].length>=30){const c=pxs.map(a=>median(a));if(dist(c[0],c[1],c[2],REF.F)<=60&&c[2]>c[0])Fc=c.map(v=>Math.round(v))}
         P.Fc=Fc;P.kap=(Fc[0]+Fc[1]+Fc[2])/(REF.F[0]+REF.F[1]+REF.F[2]);
         /* 白枠らしさの検証：中央付近の「白枠と判定した範囲」の過半が白枠色でなければ、リザルト画面のヘッダーが無い */
         {let nF=0;for(let i=0;i<pxs[0].length;i++)if(dist(pxs[0][i],pxs[1][i],pxs[2][i],Fc)<=T.F*1.6)nF++;
          if(pxs[0].length<20||nF/pxs[0].length<.5)throw new Fail(1,'画面上部に白枠（ヘッダー）が見つかりません。リザルト画面の画像ではない可能性があります')}
         /* 画像のぼけ具合：白枠下端(最も鋭いはずの縁)の「10%→90%」立ち上がり幅(画素)。縮小・圧縮・ぼかしで大きくなる。
          * 以降の段差検出の窓幅を、これに合わせて広げる（ぼけた画像でも段差を取りこぼさない） */
         {const lm=new Float32Array(2*16);let cnt=0;const acc=new Float32Array(32);
          for(const x of xs){const pr=vline(im,x,Math.max(0,P.fb-16),Math.min(H,P.fb+16),0);if(pr.length/3!=32)continue;for(let i=0;i<32;i++)acc[i]+=(pr[i*3]+pr[i*3+1]+pr[i*3+2])/3;cnt++}
          let rd=1;if(cnt){for(let i=0;i<32;i++)acc[i]/=cnt;const hi=(acc[0]+acc[1]+acc[2])/3,lo=(acc[29]+acc[30]+acc[31])/3,d=hi-lo;
            if(d>40){let y10=-1,y90=-1;for(let i=0;i<32;i++){if(y10<0&&acc[i]<hi-.1*d)y10=i;if(y90<0&&acc[i]<hi-.9*d){y90=i;break}}if(y10>=0&&y90>=0)rd=Math.max(1,y90-y10)}}
          P.rd=rd}
         line(1,'red','h',P.fb,0,W,'白枠の下端');
         log(1,`白枠の下端 y=${P.fb}（縦幅 ${P.bh}）／ 一致 ${fb.n}/${nC}本／ 白枠色 rgb(${Fc.join(',')})（仕様値比 ${(P.kap*100).toFixed(0)}%）／ 縁の立ち上がり ${P.rd}px`)}
        const Fc=P.Fc,bt=P.top,bb=P.fb,bh=P.bh;

        /* ---------------------------------------------------------------------
         * 手順2：白枠の縦幅を4等分した5本を横にスキャン（青の細線）
         *        「背景→白枠→背景」の変化を5本で多数決し、白枠の左端・右端を求める
         *        右のカメラボタン等は一部の行にしか現れない＝過半数に届かないので巻き込まない
         * ------------------------------------------------------------------- */
        {const nR=5,ys=[],votes=new Uint8Array(W);
         for(let i=0;i<nR;i++)ys.push(Math.round(bt+bh*(.1+.8*i/(nR-1))));
         for(const y of ys){const pr=hline(im,y,0,W,pw);
           for(let x=0;x<W;x++)if(dist(pr[x*3],pr[x*3+1],pr[x*3+2],Fc)<=T.F+4)votes[x]++;
           scan(2,'blue','h',y,0,W)}
         const strong=new Uint8Array(W);for(let x=0;x<W;x++)strong[x]=votes[x]>=Math.ceil(nR/2)?1:0;
         /* 小さな途切れ(文字等)は埋め、短い塊は捨てる。細かい塊の並びから左端(最初の塊)と右端の候補を決める */
         const fine=runs(strong,Math.max(4,Math.round(W*.008)),Math.max(2,Math.round(W*.004)));
         if(!fine.length)throw new Fail(2,'白枠の左右端を特定できません');
         P.left=fine[0][0];
         /* 左から順に、ジャケット/ゲージ/Sランク欄ぶんの途切れ(〜12%)で繋がる塊だけを白枠の一部とみなす（遠く離れた塊は無視） */
         const chain=[fine[0]];for(let k=1;k<fine.length;k++){if(fine[k][0]-chain[chain.length-1][1]<=W*.12)chain.push(fine[k]);else break}
         let rEnd=chain[chain.length-1][1];
         /* 白枠は画面中央に対して左右対称。右端が対称位置から大きく外れ、対称位置に近い候補があればそちらを採用
          * （カメラボタン周りの白っぽい塊を巻き込んだ場合の保険） */
         const mir=W-P.left,cand=chain.map(r=>r[1]).filter(e=>e-P.left>=W*.4);
         if(cand.length&&Math.abs(rEnd-mir)>W*.03){const nb=cand.reduce((b,e)=>Math.abs(e-mir)<Math.abs(b-mir)?e:b);
           if(Math.abs(nb-mir)<=W*.02){log(2,`右端の候補を対称位置に合わせて選択 x=${rEnd}→${nb}`);rEnd=nb}}
         P.right=rEnd;P.bw=P.right-P.left;
         if(P.bw<W*.4)throw new Fail(2,'白枠の横幅が不自然です（'+P.bw+'px）');
         const asym=P.left+P.right-W;
         if(Math.abs(asym)>W*.04)warn(2,`白枠が左右対称ではありません（ずれ ${asym}px）。カメラボタン等を巻き込んでいないか確認してください`);
         L.conf.s2=ys.length+'本';
         line(2,'blue','v',P.left,bt,bb,'白枠の左端');line(2,'blue','v',P.right,bt,bb,'白枠の右端');
         log(2,`白枠の左端 x=${P.left}／右端 x=${P.right}（横幅 ${P.bw}）／ 対称性ずれ ${asym}px`)}
        const left=P.left,right=P.right,bw=P.bw;

        /* ---------------------------------------------------------------------
         * 手順3：白枠の縦幅中央を横にスキャン（緑の細線）
         *        「白枠→ジャケット→白枠→ゲージ」の変化でジャケット左右端・ゲージ左端を求める
         *        ジャケットは中身が何色でもよい（縁＝白枠でない色の始まり/終わり）。
         *        ゲージは「白枠でない色の長い連続」として検出（色は問わない）
         * ------------------------------------------------------------------- */
        {const ym=Math.round(bt+bh/2),offs=[-2,-1,0,1,2].map(v=>Math.round(bh*v/100)),res=[],n=right-left;
         for(const off of offs){const y=ym+off,pr=hline(im,y,left,right,pw),nf=new Uint8Array(n);
           for(let i=0;i<n;i++)nf[i]=dist(pr[i*3],pr[i*3+1],pr[i*3+2],Fc)>T.NF?1:0;
           const m=majf(nf,2);
           /* ゲージ左端：ゲージ内の白い目盛りなど小さな途切れは埋めて、長い非白枠の連続の先頭 */
           const gr=runs(m,Math.round(bw*.15),Math.max(3,Math.round(bw*.015)));
           scan(3,'green','h',y,left,right,off==0);
           const gC=gr.find(r=>r[0]>=bw*.35);if(!gC){res.push(null);continue}/* ゲージは白枠の右半分にある */
           const gl=gC[0],op=runs(m,Math.max(3,Math.round(bw*.004)),0).filter(r=>r[0]<gl);
           if(!op.length){res.push(null);continue}
           const jl=op[0][0];let jr=-1;
           /* ジャケット右端：ジャケットの想定幅(縦幅の45〜110%)に収まる最後の塊の終わり
            * （ジャケット中身に白枠色に近い部分があって塊が分かれても追従できる） */
           for(let k=op.length-1;k>=0;k--){const e=op[k][1]-0;if(op[k][0]>=jl&&e<=gl&&e-jl>=bh*.45&&e-jl<=bh*1.1){jr=e;break}}
           if(jr<0)for(let k=op.length-1;k>=0;k--)if(op[k][1]<=gl){jr=op[k][1];break}
           res.push(jr<0?null:{jl:jl+left,jr:jr+left,gl:gl+left})}
         const tol=Math.max(3,bw*.004),fj=fuse(res.map(r=>r&&r.jl),tol),fr=fuse(res.map(r=>r&&r.jr),tol),fg=fuse(res.map(r=>r&&r.gl),tol);
         if(!fj||!fr||!fg||fj.n<3||fr.n<3||fg.n<3)throw new Fail(3,'ジャケット/ゲージの位置を特定できません');
         P.jl=fj.v;P.jr=fr.v;P.gl=fg.v;P.ym=ym;L.conf.s3=Math.min(fj.n,fr.n,fg.n)+'/'+offs.length;
         line(3,'green','v',P.jl,bt,bb,'ジャケットの左端');line(3,'green','v',P.jr,bt,bb,'ジャケットの右端');line(3,'green','v',P.gl,bt,bb,'ゲージの左端');
         log(3,`ジャケット左端 x=${P.jl}／右端 x=${P.jr}（幅 ${P.jr-P.jl}）／ ゲージ左端 x=${P.gl} ／ 一致 ${Math.min(fj.n,fr.n,fg.n)}/${offs.length}本`)}

        /* ---------------------------------------------------------------------
         * 手順4：ジャケットの横幅を4等分した5本を縦にスキャン（黄の細線）
         *        「白枠→ジャケットの上端→下端→白枠」。外側(白枠)から内側へ最初に現れる
         *        白枠でない色＝縁 を探すので、ジャケット中身のノイズ・白っぽい絵柄に影響されない
         * ------------------------------------------------------------------- */
        {const jw=P.jr-P.jl,nC=5,xs=[],tops=[],bots=[],mo=Math.max(2,Math.round(bh*.012));
         for(let i=0;i<nC;i++)xs.push(Math.round(P.jl+jw*(.1+.8*i/(nC-1))));
         for(const x of xs){const pr=vline(im,x,bt,bb,pw),n=bb-bt,nf=new Uint8Array(n);
           for(let i=0;i<n;i++)nf[i]=dist(pr[i*3],pr[i*3+1],pr[i*3+2],Fc)>T.NF?1:0;
           const op=runs(nf,mo,0);scan(4,'yellow','v',x,bt,bb,x==xs[nC>>1]);
           if(op.length){tops.push(bt+op[0][0]);bots.push(bt+op[op.length-1][1])}}
         const tol=Math.max(2,bh*.01),ft=fuse(tops,tol),fb=fuse(bots,tol);
         if(!ft||!fb||ft.n<3||fb.n<3)throw new Fail(4,'ジャケットの上端・下端を特定できません');
         P.jt=ft.v;P.jb=fb.v;P.jh=P.jb-P.jt;P.jm=Math.round((P.jt+P.jb)/2);L.conf.s4=Math.min(ft.n,fb.n)+'/'+nC;
         /* ジャケットは正方形：横幅と縦幅が食い違う時は、縁(白枠でない色)の有無を確認した上で横幅を縦幅に合わせる */
         const jwid=P.jr-P.jl;
         if(Math.abs(jwid-P.jh)>P.jh*.06){
           const jr2=P.jl+P.jh;let nfB=0,fG=0,c=0;
           for(const dy of[-2,-1,0,1,2]){const y=P.ym+Math.round(bh*dy/100),pr=hline(im,y,Math.max(0,jr2-4),Math.min(W,jr2+Math.max(8,Math.round(bw*.01))),0);
             for(let i=0;i<pr.length/3;i++){const dd=dist(pr[i*3],pr[i*3+1],pr[i*3+2],Fc),x=Math.max(0,jr2-4)+i;
               if(x<jr2){c++;if(dd>T.NF)nfB++}else if(dd<=T.F+4)fG++}}
           const gap=Math.min(W,jr2+Math.max(8,Math.round(bw*.01)))-jr2;
           if(c&&nfB/c>=.5&&fG/(5*Math.max(1,gap))>=.8){log(4,`ジャケット右端を正方形に合わせて補正 x=${P.jr}→${jr2}`);P.jr=jr2}
           else warn(4,`ジャケットの横幅(${jwid})と縦幅(${P.jh})が一致しません`)}
         line(4,'yellow','h',P.jt,P.jl,right,'ジャケットの上端');line(4,'yellow','h',P.jm,P.jl,right,'ジャケットの縦幅中央');line(4,'yellow','h',P.jb,P.jl,right,'ジャケットの下端');
         L.lines.forEach(l=>{if(l.s==3&&l.t=='ジャケットの右端')l.p=P.jr});/* 右端が補正された場合は手順3の線も更新 */
         log(4,`ジャケット上端 y=${P.jt}／下端 y=${P.jb}（縦幅 ${P.jh}）／ 中央 y=${P.jm} ／ 一致 ${Math.min(ft.n,fb.n)}/${nC}本`)}

        /* ---------------------------------------------------------------------
         * 手順5：ジャケット縦中央〜下端を4等分した5本を横にスキャン（紫の細線）
         *        「白枠→楽曲難易度(様々な色)→楽曲レベル(#444464・白文字)→白枠」
         *        難易度は「白枠でも紺でもない色」、白い文字は中立として扱い、
         *        DPで最もよく説明する3境界を各行で求め、有効な行の中央値を採用
         * ------------------------------------------------------------------- */
        {const nR=5,x0=P.jr+Math.max(2,Math.round(bw*.003)),x1=P.gl-Math.max(2,Math.round(bw*.003)),n=x1-x0,res=[];
         for(let i=0;i<nR;i++){const y=Math.round(P.jm+(P.jb-P.jm)*(.22+.64*i/(nR-1))),pr=hline(im,y,x0,x1,pw);
           const sF=new Float32Array(n),sD=new Float32Array(n),sL=new Float32Array(n);
           for(let k=0;k<n;k++){const r=pr[k*3],g=pr[k*3+1],b=pr[k*3+2],fF=sm(dist(r,g,b,Fc),T.F),fN=sm(dist(r,g,b,REF.NV),T.NV),
               wh=Math.min(r,g,b)>=200&&Math.max(r,g,b)-Math.min(r,g,b)<=40;
             sF[k]=wh?-.5:fF;sD[k]=wh?0:-Math.max(fF,fN);sL[k]=wh?0:fN}
           scan(5,'purple','h',y,x0,x1,i==2);
           const mn=Math.round(W*.03),sg=segDP([sF,sD,sL,sF],[0,mn,mn,0]);
           if(!sg){res.push(null);continue}

        $('#anlog').innerHTML=L?L.log.map(x=>`<li><i style="background:${SRE.COL[SCN[x.s]]||'var(--mu)'}"></i><span>手順${x.s}：${esc(x.t)}</span></li>`).join(''):'';
        $('#ancards').innerHTML=tr.regs?RR.filter(n=>tr.regs[n]).map(n=>{const r=tr.regs[n],g=r.reg;
          const t=r.text==null?(tr.ex?'<span class="anw">（OCR未実行）</span>':r.ok?'<span class="anw">OCR中…</span>':''):`<code>${esc((r.text||'').replace(/\s+/g,' ').trim())||'（空）'}</code>`;
          return`<div class="rc${g.w>g.h*6?' wd':''}"><h4><i style="background:${SRE.RC[n]}"></i>${n}　${SRE.RN[n]}<small>x ${g.x0}〜${g.x1}　y ${g.y0}〜${g.y1}　${g.w}×${g.h}</small></h4>
      <div class="rp"><figure><figcaption>処理前（切り出し）</figcaption><img src="${r.before}" alt=""></figure>
      <figure><figcaption>処理後（${r.ok?`グレー化${r.info.bright?'→白黒反転':''}→2値化→${r.info.scale}倍拡大`:'前処理に失敗'}）</figcaption>${r.ok?`<img src="${r.after}" alt="">`:`<span class="anw er">${esc(r.info.err||'')}</span>`}</figure></div>
      <div class="ro">OCR：${t}${r.val?`　→　<b>${esc(r.val)}</b>`:''}</div></div>`}).join(''):''}
      function anSave(){const c=$('#anc');if(!AN||c.width<10)return;c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=AN.name.replace(/\.[^.]+$/,'')+'_解析.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png')}
      function anClose(){if(AN&&AN.bm)AN.bm.close();AN=null;$('#an').hidden=true}
      async function anFile(fm){try{const b=await(await api(`${DV}/${fm.id}?alt=media`)).blob();anOpen(b,fm.name)}catch(e){toast('画像を取得できませんでした',null,1)}}
      Object.assign(A,{anf:()=>$('#afi').click(),anx:anClose,ans:anSave,
        anz:()=>{if(!AN)return;AN.zoom=!AN.zoom;$('.anv').classList.toggle('z',AN.zoom);$('#anz').textContent=AN.zoom?'画面に合わせる':'実寸で見る'},
        anr:t=>{const r=R.find(x=>x.id==t.dataset.id);if(r){closeM();anFile(r.fm)}},
        ane:t=>{const e=ER.find(x=>x.u==t.dataset.u);if(e){closeM();anFile(e.fm)}}});
      $('#afi').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&anOpen(f,f.name)};
      $('#an').addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.an;if(!k||!AN)return;AN.o[k]=e.target.checked;anPaint()});
      const BK=['up','ocr','del','delok','man','msave','fix','logout'];
      document.addEventListener('click',e=>{if(e.target.id=='md')return closeM();const t=e.target.closest('[data-act]');if(!t||!A[t.dataset.act])return;if(TX&&BK.includes(t.dataset.act))return toast('同期中のため操作できません。完了後、または中断後にお試しください',null,1);A[t.dataset.act](t)});
      document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(/^m_/.test(t.id)){t.classList.remove('af','fe','fg');const q=t.closest('label'),g=q&&q.querySelector('.ft');g&&g.remove();return mfU(t.id)}if(t.id=='bs'){st.b=t.value;return view()}if(!k)return;const v=t.type=='checkbox'?t.checked:t.dataset.n?+t.value:t.value;st[k]=v;if(k=='ls')st.ldir=v=='a'?-1:1;if(k=='ss')st.sdir=v=='rel'?-1:1;if(k=='ms')st.md=v=='a'?-1:1;P[st.v]()});
      document.addEventListener('keydown',e=>e.key=='Escape'&&($('#an').hidden?closeM():anClose()));
      document.addEventListener('focusin',e=>{const t=e.target;if(t.id=='m_s'&&mob())setTimeout(()=>t.closest('label').scrollIntoView({block:'start',behavior:'smooth'}),300)});
      $('#fi').onchange=e=>{const f=[...e.target.files].filter(x=>/^image\//.test(x.type));e.target.value='';f.length&&sync(f)};
      addEventListener('beforeunload',e=>{if(TX){e.preventDefault();e.returnValue=''}});
      Object.assign(A,{hser:t=>{const k=t.dataset.v;if(st.hs[k]&&Object.keys(BS).filter(x=>st.hs[x]).length==1)return;st.hs[k]=!st.hs[k];const b=$('.tabs .on[data-act=hist]');b&&($('#hc').innerHTML=hist(R.find(x=>x.id==b.dataset.id),b.dataset.v=='1'))}});
      document.addEventListener('change',e=>{const t=e.target;if(t.id=='dbs'){DB=t.value;const r=R.find(x=>x.id==t.dataset.id),b=$('.tabs .on[data-act=hist]');if(!r)return;$('#dmv').textContent=miss(r);b&&($('#hc').innerHTML=hist(r,b.dataset.v=='1'))}else if(t.dataset.np){NP[t.dataset.np]=t.checked?1:0;LS.setItem('sr_np',JSON.stringify(NP))}});
      view();
      if(LS.getItem('sr_li')&&cid())auth().then(boot).catch(()=>{});
    </script>
